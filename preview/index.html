<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gitea Mail Templates - Live Preview</title>
<style>
:root{
  --bg:#0b1120;--surface:#151d2e;--border:#1e2d45;--text:#d1d9e6;--muted:#6b7d99;
  --accent:#4da6ff;--green:#34d399;--red:#f87171;--warn:#fbbf24;
  --nav-h:48px;--panel-w:440px;--rad:6px
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}

/* Top bar */
#topbar{min-height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;flex-wrap:wrap;padding:6px 12px;gap:8px;row-gap:4px;flex-shrink:0;z-index:30;position:relative}
#topbar .brand{font-weight:700;font-size:14px;color:#fff;white-space:nowrap;letter-spacing:-0.2px}
#topbar .brand span{color:var(--accent);font-weight:400;font-size:11px;margin-left:4px;text-transform:uppercase;letter-spacing:1px}
.ctl-group{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ctl-group label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
#topbar .sep{width:1px;height:20px;background:var(--border);flex-shrink:0;align-self:center}
#topbar select{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:5px 8px;border-radius:var(--rad);font-size:12px;cursor:pointer;outline:none;min-width:80px}
#topbar select:focus{border-color:var(--accent)}
#topbar .btn-group{display:flex;flex-shrink:0}
#topbar .btn-group button{background:var(--bg);color:var(--muted);border:1px solid var(--border);padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
#topbar .btn-group button:first-child{border-radius:var(--rad) 0 0 var(--rad)}
#topbar .btn-group button:last-child{border-radius:0 var(--rad) var(--rad) 0}
#topbar .btn-group button+button{border-left:none}
#topbar .btn-group button.on{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
#topbar .hint{font-size:10px;color:var(--muted);opacity:.5;white-space:nowrap}

/* Topbar responsive — progressively compact as width shrinks */
@media(max-width:900px){#topbar .hint{display:none}}
@media(max-width:700px){
  #topbar{gap:5px;row-gap:3px;padding:4px 8px}
  #topbar .sep{display:none}
  #topbar select{min-width:70px;font-size:11px;padding:4px 6px}
  .ctl-group label{font-size:9px}
  #topbar .btn-group button{padding:4px 10px;font-size:11px}
}
@media(max-width:500px){
  #topbar{gap:4px;row-gap:2px;padding:4px 6px}
  #topbar .brand{font-size:12px}
  #topbar .brand span{font-size:10px}
  #topbar select{min-width:60px;font-size:10px;padding:3px 5px}
  #topbar .btn-group button{padding:3px 8px;font-size:10px}
}

/* Main layout */
#main{flex:1;display:flex;position:relative;min-height:0;overflow:hidden}
#preview-area{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;background:linear-gradient(135deg,#0b1120,#131c30,#0d1525);transition:padding-right .3s cubic-bezier(.4,0,.2,1)}

/* --- Floating panel --- */
#panel{
  position:absolute;right:12px;top:12px;bottom:12px;
  width:var(--panel-w);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:-4px 4px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.03) inset;
  z-index:20;
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s ease,box-shadow .35s ease;
}
#panel.collapsed{
  transform:translateX(calc(var(--panel-w) - 36px));
  box-shadow:-2px 2px 16px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.03) inset;
  opacity:.92;
}
#panel.collapsed:hover{opacity:1}

/* Panel drag-handle / collapse tab */
#panel-handle{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:28px;height:64px;
  background:var(--surface);
  border:1px solid var(--border);
  border-right:none;
  border-radius:6px 0 0 6px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
  z-index:21;
  /* sit just outside the panel's left edge */
  margin-left:-1px;
}
#panel.collapsed #panel-handle{
  /* when collapsed, handle moves with panel, peeking from right edge */
  left:1px;
}
#panel-handle:hover{background:var(--bg)}
#panel-handle svg{
  width:14px;height:14px;
  stroke:var(--muted);
  fill:none;stroke-width:2;
  transition:transform .35s cubic-bezier(.4,0,.2,1),stroke .15s;
}
#panel-handle:hover svg{stroke:var(--text)}
#panel.collapsed #panel-handle svg{transform:rotate(180deg)}

/* Panel inner scroll */
#panel-body{flex:1;overflow-y:auto;overflow-x:hidden}

/* Panel close button (top-right) */
#panel-close{
  position:absolute;right:8px;top:8px;
  width:24px;height:24px;
  background:none;border:none;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:4px;
  color:var(--muted);
  font-size:16px;line-height:1;
  transition:background .15s,color .15s;
  z-index:2;
}
#panel-close:hover{background:rgba(255,255,255,.06);color:var(--text)}

/* Section */
#panel section{padding:12px 14px;border-bottom:1px solid var(--border)}
#panel section:last-child{border-bottom:none}

/* Collapsible section header */
.section-hdr{
  display:flex;align-items:center;gap:6px;
  cursor:pointer;
  user-select:none;
  padding:2px 0;
  border-radius:4px;
  transition:color .15s;
}
.section-hdr:hover{color:#fff}
.section-hdr h3{
  font-size:10px;font-weight:600;color:inherit;text-transform:uppercase;letter-spacing:.8px;
  flex:1;
}
.section-chevron{
  width:12px;height:12px;
  stroke:currentColor;fill:none;stroke-width:2;
  transition:transform .25s ease;
  flex-shrink:0;
  opacity:.5;
}
.section-hdr:hover .section-chevron{opacity:1}
section.collapsed .section-chevron{transform:rotate(-90deg)}

/* Collapsible content wrapper */
.section-content{
  overflow:hidden;
  transition:max-height .3s ease,opacity .25s ease,margin-top .3s ease;
  max-height:2000px;
  opacity:1;
  margin-top:10px;
}
section.collapsed .section-content{
  max-height:0;
  opacity:0;
  margin-top:0;
}

#panel .card{background:var(--bg);border-radius:var(--rad);padding:10px 12px;margin-bottom:8px}
#panel .card:last-child{margin-bottom:0}
#panel .card .label{font-size:10px;color:var(--muted);margin-bottom:2px}
#panel .card .value{font-size:12px;color:var(--text)}
#panel table{width:100%;border-collapse:collapse}
#panel table td{padding:4px 6px;font-size:11px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:top}
#panel table td:first-child{font-family:monospace;color:var(--accent);font-size:10px;width:0;white-space:nowrap}
#panel table td:last-child{color:var(--muted);text-align:right;font-size:10px;word-break:break-all}
#panel .badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.badge-req{background:rgba(52,211,153,.12);color:var(--green)}
.badge-opt{background:rgba(107,125,153,.1);color:var(--muted)}
#panel .stat{font-size:10px;color:var(--muted);margin-top:6px}

/* Viewport */
#viewport{border-radius:var(--rad);box-shadow:0 8px 32px rgba(0,0,0,.45);transition:all .3s;flex-shrink:0;overflow:hidden;background:#fff}
#viewport.desktop{width:1386px;height:780px}
#viewport.mobile{width:390px;height:780px;border-radius:28px;border:3px solid #1e293b;box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 0 0 1px #0f172a;display:flex;flex-direction:column}
#viewport.mobile::before{content:'';display:block;height:24px;background:#1e293b;flex-shrink:0}
#preview-frame{width:100%;height:100%;border:none;display:block;background:#fff}
#viewport.desktop #preview-frame{border-radius:var(--rad)}

/* Loading */
.loading-wrap{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;flex-direction:column;gap:8px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#messages{flex-shrink:0}
.message{display:block;padding:6px 16px;font-size:11px;text-align:center;border-bottom:1px solid transparent}
.message-warn{background:rgba(251,191,36,0.08);color:rgba(251,191,36,0.75);border-color:rgba(251,191,36,0.15)}
.message-error{background:rgba(248,113,113,0.08);color:rgba(248,113,113,0.75);border-color:rgba(248,113,113,0.15)}
.message-info{background:rgba(77,166,255,0.08);color:rgba(77,166,255,0.8);border-color:rgba(77,166,255,0.15)}
.message code{background:rgba(0,0,0,0.12);padding:1px 6px;border-radius:3px}

/* Scrollbar — neutral gray, consistent across all browsers */
html,body,#preview-area,#panel-body{
  scrollbar-width:thin;
  scrollbar-color:rgba(107,125,153,.25) transparent;
}
#preview-area,#panel-body{
  -ms-overflow-style:-ms-autohiding-scrollbar;
}
#preview-area::-webkit-scrollbar,
#panel-body::-webkit-scrollbar          { width:6px; height:6px }
#preview-area::-webkit-scrollbar-track,
#panel-body::-webkit-scrollbar-track    { background:transparent }
#preview-area::-webkit-scrollbar-thumb,
#panel-body::-webkit-scrollbar-thumb    {
  background-color:rgba(107,125,153,.25);
  border-radius:3px;
  border:1px solid rgba(255,255,255,.06);
}
#preview-area::-webkit-scrollbar-thumb:hover,
#panel-body::-webkit-scrollbar-thumb:hover { background-color:rgba(107,125,153,.45) }
#preview-area::-webkit-scrollbar-corner,
#panel-body::-webkit-scrollbar-corner   { background:transparent }

@media(max-width:900px){
  #panel{--panel-w:380px;right:6px;top:6px;bottom:6px}
  #panel.collapsed{transform:translateX(calc(var(--panel-w) - 36px))}
}
@media(max-width:700px){
  #panel{display:none}
}
</style>
</head>
<body>

<nav id="topbar">
  <span class="brand">Gitea Mail Templates <span>Preview</span></span>
  <span class="sep"></span>
  <span class="ctl-group">
    <label>Theme</label>
    <select id="sel-theme" onchange="switchTheme(this.value)"></select>
  </span>
  <span class="sep"></span>
  <span class="ctl-group">
    <label>Template</label>
    <select id="sel-template" onchange="switchTemplate(this.value)"></select>
  </span>
  <span class="sep"></span>
  <span class="ctl-group">
    <label>View</label>
    <select id="sel-client" onchange="switchClient(this.value)">
      <option value="modern">Modern</option>
      <option value="source">Source</option>
    </select>
  </span>
  <span class="sep"></span>
  <div class="btn-group">
    <button id="btn-desk" class="on" onclick="setViewport('desktop')">Desktop</button>
    <button id="btn-mob" onclick="setViewport('mobile')">Mobile</button>
  </div>
  <span class="hint">keys: d/m &nbsp; &larr;&rarr; tab &nbsp; &uarr;&darr; select &nbsp; p toggle panel</span>
</nav>

<div id="messages"></div>

<div id="main">
  <div id="preview-area">
    <div id="viewport" class="desktop">
      <div class="loading-wrap" id="loading">
        <div class="spinner"></div>
        <span>Loading pre-rendered templates...</span>
      </div>
      <iframe id="preview-frame" style="display:none"></iframe>
    </div>
  </div>

  <aside id="panel">
    <!-- Collapse handle tab on the left edge -->
    <div id="panel-handle" title="Toggle panel" onclick="togglePanel()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </div>

    <!-- Close button (top-right) -->
    <button id="panel-close" title="Close panel" onclick="togglePanel()">&times;</button>

    <div id="panel-body">
      <section id="sec-info">
        <div class="section-hdr" onclick="toggleSection('sec-info')">
          <h3>Current Template</h3>
          <svg class="section-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="section-content">
          <div class="card">
            <div class="label">Type</div>
            <div class="value" id="panel-name">-</div>
          </div>
          <div class="card">
            <div class="label">Description</div>
            <div class="value" id="panel-desc" style="font-size:11px;line-height:1.5">-</div>
          </div>
          <div class="stat" id="panel-stats"></div>
        </div>
      </section>

      <section id="sec-params">
        <div class="section-hdr" onclick="toggleSection('sec-params')">
          <h3>Parameters</h3>
          <svg class="section-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="section-content">
          <table id="panel-params"><tr><td colspan="2" style="color:var(--muted)">-</td></tr></table>
        </div>
      </section>

      <section id="sec-source">
        <div class="section-hdr" onclick="toggleSection('sec-source')">
          <h3>Source</h3>
          <svg class="section-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="section-content">
          <div class="card" style="font-family:monospace;font-size:10px;color:var(--muted);word-break:break-all" id="panel-path">-</div>
        </div>
      </section>
    </div>
  </aside>
</div>

<script src="rendered.js"></script>
<script>
//
// State — REGISTRY and PARAMS are loaded from rendered.js (single source of truth)
//
const state = { theme:'', template:'', client:'modern', viewport:'desktop' };
let REGISTRY = {};
let PARAMS = {};
let rendered = null;        // window.__RENDERED__
let devMode = false;        // true once SSE connects

//
// Client transforms
//
function transform(html, mode) {
  // Source view — escape HTML for raw display
  if(mode==='source') {
    const e = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<!DOCTYPE html><html><head><style>body{background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:16px;margin:0}pre{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.6;margin:0}</style></head><body><pre>'+e+'</pre></body></html>';
  }
  return html;
}

//
// Render preview
//
function render() {
  const frame = document.getElementById('preview-frame');
  const loading = document.getElementById('loading');
  if(!rendered) return;

  if (location.protocol !== 'file:') {
    frame.setAttribute('sandbox', '');
  }

  frame.style.display = 'none';
  loading.style.display = 'flex';

  const src = rendered;
  const raw = src[state.theme]?.[state.template];
  let content = raw ? transform(raw, state.client) : '<p style=\"color:red;padding:20px\">Not found: '+state.theme+'/'+state.template+'</p>';
  content = content.replace('</head>', '<style>html{scrollbar-color:rgba(107,125,153,.25) transparent;scrollbar-width:thin;-ms-overflow-style:-ms-autohiding-scrollbar}html::-webkit-scrollbar{width:6px;height:6px}html::-webkit-scrollbar-track{background:transparent}html::-webkit-scrollbar-thumb{background-color:rgba(107,125,153,.25);border-radius:3px;border:1px solid rgba(255,255,255,.06)}html::-webkit-scrollbar-thumb:hover{background-color:rgba(107,125,153,.45)}html::-webkit-scrollbar-corner{background:transparent}</style></head>');

  let done = false;
  function finish() {
    if (done) return; done = true;
    loading.style.display = 'none';
    frame.style.display = 'block';
    frame.onload = null;
  }
  frame.onload = finish;
  frame.srcdoc = content;
  setTimeout(finish, 5000);
  updatePanel();
}

//
// Panel — collapse/expand
//
function togglePanel() {
  const panel = document.getElementById('panel');
  panel.classList.toggle('collapsed');
}

function toggleSection(id) {
  const sec = document.getElementById(id);
  sec.classList.toggle('collapsed');
}

//
// Panel content updates
//
function updatePanel() {
  const r = REGISTRY[state.template];
  document.getElementById('panel-name').textContent = r ? r.name : state.template;
  document.getElementById('panel-desc').textContent = r ? r.desc : '';
  document.getElementById('panel-path').textContent = r ? 'themes/'+state.theme+'/'+r.path : '-';

  // Template stats
  const themes = rendered ? Object.keys(rendered).length : 0;
  let totalTemplates = 0, totalFailed = 0;
  if (rendered && rendered[state.theme]) {
    const themeData = rendered[state.theme];
    totalTemplates = Object.keys(themeData).length;
    for (const v of Object.values(themeData)) {
      if (v.startsWith('<p style=\'color:red\'')) totalFailed++;
    }
  }
  document.getElementById('panel-stats').textContent =
    themes + ' themes loaded · ' + totalTemplates + ' templates (' + (totalTemplates - totalFailed) + ' ok, ' + totalFailed + ' failed)';

  const p = PARAMS[state.template] || {};
  let rows = '';
  for(const [k,v] of Object.entries(p)){
    const isReq = !k.includes('RenderedNote') && !k.includes('Attachments') && !k.includes('DisableDownload') && !k.includes('IsMention') && !k.includes('IsPull') && !k.includes('IsForcePush') && !k.includes('ReviewComments') && !k.includes('Commits') && !k.includes('BaseBranch');
    rows += '<tr><td>.'+k+'</td><td>'+String(v)+'</td><td><span class="badge '+(isReq?'badge-req':'badge-opt')+'">'+(isReq?'required':'optional')+'</span></td></tr>';
  }
  document.getElementById('panel-params').innerHTML = rows || '<tr><td colspan="3" style="color:var(--muted)">-</td></tr>';
}

//
// Events
//
function switchTheme(v) { state.theme=v; render(); }
function switchTemplate(v) { state.template=v; render(); }
function switchClient(v) { state.client=v; render(); }
function setViewport(v) {
  state.viewport=v;
  document.getElementById('btn-desk').classList.toggle('on',v==='desktop');
  document.getElementById('btn-mob').classList.toggle('on',v==='mobile');
  document.getElementById('viewport').className=v;
  render();
}

//
// Keyboard
//
document.addEventListener('keydown',e=>{
  // Viewport shortcuts (no modifiers)
  if(e.key==='d'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ setViewport('desktop'); return; }
  if(e.key==='m'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ setViewport('mobile'); return; }
  // 'p' to toggle floating panel
  if(e.key==='p'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ togglePanel(); return; }

  // ← →  cycle focus between Theme / Template / Client selects
  const selects=['sel-theme','sel-template','sel-client'];
  const activeId=document.activeElement?.id;
  const cur=selects.indexOf(activeId);

  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();
    if(cur>=0){
      const dir=e.key==='ArrowRight'?1:-1;
      const next=(cur+dir+selects.length)%selects.length;
      document.getElementById(selects[next])?.focus();
    } else {
      document.getElementById('sel-template')?.focus();
    }
  }
});

//
// Init — load everything from rendered.js (single source of truth)
//
(function(){
  if(window.__REGISTRY__) REGISTRY = window.__REGISTRY__;
  if(window.__PARAMS__)   PARAMS   = window.__PARAMS__;

  if(window.__RENDERED__){
    rendered = window.__RENDERED__;

    const themeKeys = Object.keys(rendered).sort();
    const selTheme = document.getElementById('sel-theme');
    themeKeys.forEach(t => {
      const o = document.createElement('option');
      o.value = t;
      o.textContent = t.charAt(0).toUpperCase() + t.slice(1);
      selTheme.appendChild(o);
    });
    state.theme = themeKeys[0] || '';

    const selTpl = document.getElementById('sel-template');
    for(const [id, t] of Object.entries(REGISTRY)){
      const o = document.createElement('option');
      o.value = id;
      o.textContent = t.name;
      selTpl.appendChild(o);
    }
    state.template = Object.keys(REGISTRY)[0] || '';
  } else {
    document.getElementById('loading').style.display='none';
    showMessage('rendered.js not found — run <code>cd tools &amp;&amp; go run . preview all</code> to generate', 'error');
  }
  render();
})();

// Message helpers
function showMessage(ht, type) {
  const container = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'message message-' + (type || 'warn');
  el.innerHTML = ht;
  container.appendChild(el);
  return el;
}
function clearMessages() {
  document.getElementById('messages').innerHTML = '';
}

function setDevMode(on) {
  devMode = on;
  if (on) {
    clearMessages();
    showMessage(
      'Live reload active — changes to .tmpl files will auto-refresh the preview.',
      'info'
    ).id = 'msg-dev-disclaimer';
  }
}

// Dev-server live-reload (SSE)
(function(){
  let es;
  try {
    es = new EventSource('/events');
  } catch(e) {
    return;
  }
  es.onmessage = function(e) {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'reload') {
        const script = document.createElement('script');
        script.src = 'rendered.js?v=' + Date.now();
        script.onload = function() {
          if (window.__RENDERED__) rendered = window.__RENDERED__;
          if (window.__REGISTRY__) REGISTRY = window.__REGISTRY__;
          if (window.__PARAMS__)   PARAMS   = window.__PARAMS__;
          render();
        };
        document.head.appendChild(script);
      } else if (msg.type === 'error') {
        showMessage(msg.message, 'error');
      }
    } catch(_) {}
  };
  es.onopen = function() {
    setDevMode(true);
    console.log('[dev] live-reload connected');
  };
  es.onerror = function() {
    if (devMode) {
      showMessage('Dev server disconnected — reload the page to reconnect', 'error');
      setDevMode(false);
    }
    console.log('[dev] live-reload disconnected');
  };
})();
</script>
</body>
</html>
